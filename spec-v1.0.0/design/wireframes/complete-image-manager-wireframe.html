<div id="mw-wireframe"><header class="mw-top"></header><div class="mw-shell"><aside class="mw-sidebar"></aside><main class="mw-main"></main></div><footer class="mw-status" aria-live="polite"></footer><dialog class="mw-modal" aria-label="操作視窗"></dialog></div>
<style>
#mw-wireframe{--mw-paper:light-dark(#fff,#202020);--mw-surface:light-dark(#f3f3f3,#292929);--mw-text:light-dark(#252525,#ededed);--mw-sub:light-dark(#666,#b7b7b7);--mw-line:light-dark(#b7b7b7,#686868);font:14px/1.5 system-ui,sans-serif;color:var(--mw-text);background:var(--mw-paper);border:1px solid var(--mw-line)}
#mw-wireframe *{box-sizing:border-box}#mw-wireframe [hidden]{display:none!important}
#mw-wireframe .mw-modal{color:var(--mw-text);background:var(--mw-paper);border:1px solid var(--mw-line);border-radius:6px;padding:0;width:540px;max-width:calc(100% - 28px);max-height:85vh;box-shadow:0 18px 60px #0005}#mw-wireframe .mw-modal::backdrop{background:#0006}#mw-wireframe .mw-modal .mw-panel{margin:0;padding:24px;border:0;background:var(--mw-paper)}#mw-wireframe .mw-modal .mw-actions{justify-content:flex-end;margin-top:24px}#mw-wireframe .mw-shell.mw-separate{grid-template-columns:1fr}#mw-wireframe .mw-separate .mw-sidebar{display:none}#mw-wireframe .mw-table-wrap{overflow:auto}#mw-wireframe table{width:100%;border-collapse:collapse;text-align:left;margin:22px 0}#mw-wireframe th,#mw-wireframe td{border-bottom:1px solid var(--mw-line);padding:14px 10px;vertical-align:top;overflow-wrap:anywhere}#mw-wireframe th{font-weight:500;background:var(--mw-surface)}#mw-wireframe .mw-window-heading{padding-bottom:18px;border-bottom:1px solid var(--mw-line);margin-bottom:22px}
#mw-wireframe button,#mw-wireframe input,#mw-wireframe select{font:inherit;color:inherit;background:var(--mw-paper);border:1px solid var(--mw-line);border-radius:3px;padding:7px 10px;max-width:100%}#mw-wireframe button{cursor:inherit}#mw-wireframe button:disabled{opacity:.45}#mw-wireframe button.mw-primary{background:var(--mw-text);color:var(--mw-paper)}
#mw-wireframe .mw-top{padding:16px 20px;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;border-bottom:1px solid var(--mw-line)}
#mw-wireframe strong{font-weight:500}#mw-wireframe .mw-small{font-size:12px;color:var(--mw-sub)}#mw-wireframe .mw-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}#mw-wireframe .mw-shell{display:grid;grid-template-columns:184px minmax(0,1fr)}
#mw-wireframe .mw-sidebar{padding:20px 12px;background:var(--mw-surface);border-right:1px solid var(--mw-line)}#mw-wireframe .mw-sidebar h3{font-size:12px;color:var(--mw-sub);font-weight:500;margin:0 0 10px}#mw-wireframe .mw-sidebar h3:not(:first-child){margin-top:26px}#mw-wireframe .mw-sidebar button{width:100%;text-align:left;margin-bottom:6px;background:transparent;border-color:transparent}#mw-wireframe .mw-sidebar button[aria-current]{border-color:var(--mw-line);background:var(--mw-paper)}#mw-wireframe .mw-sidebar button.mw-create{border:1px dashed var(--mw-line);margin-top:8px}
#mw-wireframe .mw-main{padding:20px;min-width:0;min-height:560px}#mw-wireframe h2{font-size:20px;font-weight:500;margin:0 0 3px}#mw-wireframe h3{font-size:15px;font-weight:500;margin:0 0 10px}#mw-wireframe p{margin:6px 0 14px}#mw-wireframe .mw-title{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}#mw-wireframe .mw-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 0;border-top:1px solid var(--mw-line);border-bottom:1px solid var(--mw-line)}#mw-wireframe .mw-tools input[type=search]{width:180px}#mw-wireframe .mw-selection{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:12px 0}#mw-wireframe .mw-columns,#mw-wireframe .mw-item{display:grid;grid-template-columns:22px minmax(0,1fr) minmax(0,1fr) 96px;gap:14px}#mw-wireframe .mw-columns{background:var(--mw-surface);padding:9px 8px;font-size:12px}#mw-wireframe .mw-item{padding:16px 8px;border-bottom:1px solid var(--mw-line);align-items:start}#mw-wireframe .mw-item>input{margin-top:8px}#mw-wireframe .mw-item .mw-row-action{padding-top:4px}#mw-wireframe .mw-row-action button{width:100%;margin-bottom:8px}#mw-wireframe .mw-file{overflow-wrap:anywhere;font-weight:500;margin-top:7px}
#mw-wireframe .mw-image{height:104px;border:1px solid var(--mw-line);display:flex;align-items:center;justify-content:center;background-color:var(--mw-surface);position:relative;isolation:isolate}#mw-wireframe .mw-image:before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(to top right,transparent calc(50% - .5px),var(--mw-line) 50%,transparent calc(50% + .5px)),linear-gradient(to bottom right,transparent calc(50% - .5px),var(--mw-line) 50%,transparent calc(50% + .5px))}#mw-wireframe .mw-image span{background:var(--mw-paper);padding:3px 9px;border:1px solid var(--mw-line)}#mw-wireframe .mw-image.mw-empty{border-style:dashed;background:var(--mw-paper)}#mw-wireframe .mw-empty:before{display:none}#mw-wireframe[data-bg=checker] .mw-image:not(.mw-empty){background-image:conic-gradient(var(--mw-paper) 25%,var(--mw-surface) 0 50%,var(--mw-paper) 0 75%,var(--mw-surface) 0);background-size:18px 18px}#mw-wireframe[data-bg=white] .mw-image:not(.mw-empty){background:#fff}#mw-wireframe[data-bg=black] .mw-image:not(.mw-empty){background:#000}#mw-wireframe[data-bg=custom] .mw-image:not(.mw-empty){background:var(--mw-custom)}
#mw-wireframe .mw-note{padding:12px;border:1px dashed var(--mw-line);background:var(--mw-surface);margin:12px 0}#mw-wireframe .mw-panel{border:1px solid var(--mw-line);padding:16px;margin:0 0 18px;background:var(--mw-surface)}#mw-wireframe .mw-panel .mw-actions{margin-top:14px}#mw-wireframe .mw-choice{display:flex;gap:9px;align-items:center;padding:8px 0;overflow-wrap:anywhere}#mw-wireframe .mw-status{padding:10px 18px;border-top:1px solid var(--mw-line);font-size:12px;color:var(--mw-sub)}#mw-wireframe .mw-detail-pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin:20px 0}#mw-wireframe .mw-detail-pair .mw-image{height:180px}#mw-wireframe .mw-history{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:14px;padding:14px 0;border-bottom:1px solid var(--mw-line);align-items:center}#mw-wireframe .mw-history .mw-image{height:60px}#mw-wireframe .mw-history .mw-image span{font-size:12px}#mw-wireframe .mw-history .mw-actions{justify-content:flex-end}#mw-wireframe .mw-detail-back{margin-bottom:18px}#mw-wireframe .mw-bottom{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-top:16px}
@media(max-width:760px){#mw-wireframe .mw-shell{grid-template-columns:1fr}#mw-wireframe .mw-sidebar{border-right:0;border-bottom:1px solid var(--mw-line);padding:12px}#mw-wireframe .mw-sidebar button{width:auto;margin-right:4px}#mw-wireframe .mw-sidebar h3{margin-bottom:6px}#mw-wireframe .mw-sidebar h3:not(:first-child){margin-top:12px}#mw-wireframe .mw-main{padding:14px}#mw-wireframe .mw-columns,#mw-wireframe .mw-item{grid-template-columns:20px minmax(0,1fr) minmax(0,1fr);gap:9px}#mw-wireframe .mw-columns>span:last-child{display:none}#mw-wireframe .mw-row-action{grid-column:2/4;display:flex;gap:10px;align-items:center}#mw-wireframe .mw-row-action button{width:auto!important;margin:0!important}#mw-wireframe .mw-history{grid-template-columns:60px minmax(0,1fr)}#mw-wireframe .mw-history .mw-actions{grid-column:2;justify-content:flex-start}}
@media(max-width:420px){#mw-wireframe .mw-detail-pair{grid-template-columns:1fr}#mw-wireframe .mw-top{padding:12px}#mw-wireframe button,#mw-wireframe input,#mw-wireframe select{min-height:40px}#mw-wireframe .mw-image{height:86px}}
</style>
<style>
#mw-wireframe .mw-project-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;margin-top:26px}
#mw-wireframe .mw-project-card{border:1px solid var(--mw-line);padding:20px;background:var(--mw-paper)}
#mw-wireframe .mw-project-card p{overflow-wrap:anywhere}#mw-wireframe .mw-form{display:grid;gap:18px;max-width:620px;margin:24px 0}#mw-wireframe .mw-form label{display:grid;gap:6px}#mw-wireframe .mw-form input{width:100%}
#mw-wireframe .mw-drop{border:1px dashed var(--mw-line);padding:24px;text-align:center;margin:20px 0;background:var(--mw-surface)}#mw-wireframe .mw-error{border:1px solid var(--mw-line);padding:10px;margin:12px 0;font-weight:500}#mw-wireframe .mw-summary{display:flex;gap:18px;flex-wrap:wrap;margin:12px 0}#mw-wireframe .mw-subhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:16px 0}#mw-wireframe .mw-path{overflow-wrap:anywhere}#mw-wireframe .mw-modal .mw-panel{max-height:none}#mw-wireframe .mw-main{min-height:520px}#mw-wireframe .mw-table-wrap select{min-width:140px}#mw-wireframe .mw-image img{width:100%;height:100%;object-fit:contain}#mw-wireframe .mw-image .mw-filename{max-width:90%;overflow-wrap:anywhere}
</style>
<script>
(()=>{
const root=document.getElementById('mw-wireframe'),head=root.querySelector('.mw-top'),main=root.querySelector('.mw-main'),side=root.querySelector('.mw-sidebar'),shell=root.querySelector('.mw-shell'),foot=root.querySelector('.mw-status'),modal=root.querySelector('.mw-modal');
const E=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const B=(text,act,value='',primary=false,disabled=false)=>`<button type="button" class="cursor-interaction ${primary?'mw-primary':''}" data-act="${act}" data-val="${E(value)}" ${disabled?'disabled':''}>${text}</button>`;
const seed=(id,name,path)=>({id,name,path,last:'尚未編輯',scope:'g1',search:'',filter:'all',bg:'checker',color:'#bcbcbc',groups:[{id:1,name:'角色 A 差分',members:[1,2,3]},{id:2,name:'待修改素材',members:[2,4]}],assets:[{id:1,name:'heroine_01.png',folder:'pictures',w:1024,h:768,alpha:true,versions:[{id:2,w:1024,h:768,alpha:true,time:'今天 14:32',name:'heroine_01.png'},{id:1,w:1024,h:768,alpha:true,time:'昨天 18:10',name:'heroine_01.png'}],active:2,next:3,deployed:1},{id:2,name:'heroine_02.png',folder:'pictures',w:1024,h:768,alpha:true,versions:[{id:1,w:1200,h:768,alpha:true,time:'今天 14:35',name:'heroine_02.png'}],active:1,next:2,deployed:null},{id:3,name:'heroine_03.png',folder:'pictures',w:1024,h:768,alpha:true,versions:[],active:null,next:1,deployed:null},{id:4,name:'heroine_04.png',folder:'pictures',w:1024,h:768,alpha:true,versions:[],active:null,next:1,deployed:null},{id:5,name:'hero_walk.png',folder:'characters',w:576,h:384,alpha:true,versions:[],active:null,next:1,deployed:null}]});
let projects=[seed(1,'月影之旅','D:/Games/MoonJourney'),seed(2,'森林物語','D:/Games/ForestStory')];projects[1].assets.forEach(a=>{a.versions=[];a.active=null;a.deployed=null;a.next=1;});
const storageKey='rpg-image-wireframe-session-v3';let persistent=false;try{const saved=JSON.parse(localStorage.getItem(storageKey)||'null');if(saved&&saved.schema===3&&Array.isArray(saved.projects)&&saved.projects.length)projects=saved.projects;localStorage.setItem(storageKey,JSON.stringify({schema:3,projects}));persistent=true;}catch{}
let projectId=projects[0].id,screen='home',selected=new Set(),detailId=null,previewId=null,pop=null,returnFocus=null,imports=[],restoreIds=new Set(),ack=false,notice='';
const P=()=>projects.find(p=>p.id===projectId),A=()=>P().assets.find(a=>a.id===detailId),G=()=>P().groups.find(g=>'g'+g.id===P().scope),V=a=>a.versions.find(v=>v.id===a.active);
const gcd=(a,b)=>b?gcd(b,a%b):a,ratio=(w,h)=>`${w/gcd(w,h)}:${h/gcd(w,h)}`;
const diffs=(a,v)=>!v?[]:[...(a.w!==v.w||a.h!==v.h?[`解析度 ${a.w} × ${a.h} → ${v.w} × ${v.h}`]:[]),...(ratio(a.w,a.h)!==ratio(v.w,v.h)?[`長寬比 ${ratio(a.w,a.h)} → ${ratio(v.w,v.h)}`]:[]),...(a.alpha!==v.alpha?[`透明通道：${a.alpha?'有':'無'} → ${v.alpha?'有':'無'}`]:[])];
const pending=a=>a.active!==null&&a.active!==a.deployed;
const status=a=>pending(a)?'待套用':a.deployed!==null?'已套用':'尚未替換';
const scoped=()=>P().assets.filter(a=>P().scope==='all'||P().scope==='f'+a.folder||(G()&&G().members.includes(a.id)));
const visible=()=>scoped().filter(a=>a.name.toLowerCase().includes(P().search.toLowerCase())&&(P().filter==='all'||P().filter==='pending'&&pending(a)||P().filter==='warning'&&diffs(a,V(a)).length||P().filter==='empty'&&!V(a)||P().filter==='applied'&&a.deployed!==null));
const scopeTitle=()=>G()?G().name:P().scope==='all'?'全部素材':'img / '+P().scope.slice(1);
const metadata=v=>`${v.w} × ${v.h} · ${ratio(v.w,v.h)} · PNG · ${v.alpha?'有':'無'}透明通道`;
const img=(label,empty=false)=>`<div class="mw-image ${empty?'mw-empty':''}"><span class="mw-filename">${E(label)}</span></div>`;
function save(message){P().last='剛剛';try{localStorage.setItem(storageKey,JSON.stringify({schema:3,projects}));persistent=true;}catch{persistent=false;}notice=message||'進度已儲存';}
function view(next){screen=next;pop=null;ack=false;if(next==='restore')restoreIds=new Set(P().assets.filter(a=>a.deployed!==null).map(a=>a.id));render();}
function open(type,data={}){returnFocus=document.activeElement;pop={type,...data};drawModal();}
function closeModal(){pop=null;modal.close();if(returnFocus&&returnFocus.isConnected)returnFocus.focus({preventScroll:true});}
function commit(message){closeModal();save(message);render();}
function addVersion(a,data){const id=a.next++;a.versions.unshift({id,w:data.w,h:data.h,alpha:data.alpha,name:data.name||a.name,time:'剛剛（示意）'});a.active=id;return id;}
function header(){head.innerHTML=`<div><strong>RPG Maker 圖片管理器</strong><div class="mw-small">互動 Wireframe · 示意素材</div></div><div class="mw-actions">${screen!=='home'&&screen!=='new'?B('專案首頁','home')+`<select aria-label="切換遊戲專案" data-project>${projects.map(p=>`<option value="${p.id}" ${p.id===projectId?'selected':''}>${E(p.name)}</option>`).join('')}</select><span class="mw-small">✓ ${persistent?'預覽進度已儲存':'本次預覽進度已保留'}</span>`:''}</div>`;}
function sidebar(){side.innerHTML=`<h3>原始資料夾</h3>${B('全部素材（'+P().assets.length+'）','scope','all')}${['pictures','characters'].map(f=>B('img / '+f+'（'+P().assets.filter(a=>a.folder===f).length+'）','scope','f'+f)).join('')}<h3>自訂群組</h3>${P().groups.map(g=>B(E(g.name)+'（'+g.members.length+'）','scope','g'+g.id)).join('')}${B('＋ 建立群組','new-group')}`;side.querySelectorAll('[data-act=scope]').forEach(b=>{if(b.dataset.val===P().scope)b.setAttribute('aria-current','page');});}
function home(){return `<div class="mw-title"><div><h2>遊戲專案</h2><div class="mw-small">各遊戲獨立保存素材、群組與替換進度</div></div>${B('＋ 建立專案','new', '',true)}</div><div class="mw-project-grid">${projects.map(p=>`<section class="mw-project-card"><h3>${E(p.name)}</h3><p class="mw-small mw-path">${E(p.path)}</p><p>${p.assets.length} 張素材 · ${p.assets.filter(pending).length} 張待套用</p><div class="mw-small">上次編輯：${E(p.last)}</div><div class="mw-bottom">${B('開啟專案 →','open-project',p.id,true)}</div></section>`).join('')}</div><div class="mw-note">可使用示意素材走完：整理群組 → 匯出 → 匯入配對 → 檢查版本 → 套用 → 還原。</div>`;}
function createPage(){return `${B('← 專案首頁','home')}<h2 style="margin-top:18px">建立遊戲專案</h2><div class="mw-form"><label>專案名稱<input id="pr-name" value="新遊戲專案" maxlength="60"></label><label>遊戲資料夾<input id="pr-path" value="D:/Games/MyGame"></label>${B('選擇示意遊戲資料夾','pick-folder')}<div class="mw-note">讀取素材 → 保存原始基準 → 依原始資料夾分類<br><span class="mw-small">本 Wireframe 使用內建素材示例。</span></div></div><div class="mw-error" id="pr-error" role="alert" hidden></div><div class="mw-bottom">${B('取消','home')}${B('建立專案並讀取素材','create-project','',true)}</div>`;}
function selectionBar(){const rows=visible(),all=rows.length&&rows.every(a=>selected.has(a.id));return `<label class="mw-actions"><input type="checkbox" data-all ${all?'checked':''}>全選目前列表 · 已選 ${selected.size} 張</label><div class="mw-actions">${B('批量匯出','export')}${B('加入群組','assign-group','',false,!selected.size)}${G()?B('從群組移除','remove','',false,!selected.size):''}</div>`;}
function rows(){return visible().map(a=>{const v=V(a),d=diffs(a,v);return `<article class="mw-item"><input type="checkbox" data-check="${a.id}" aria-label="選取 ${a.name}" ${selected.has(a.id)?'checked':''}><div>${img('原圖 '+a.id)}<div class="mw-file">${a.name}</div><div class="mw-small mw-path">img/${a.folder}/${a.name}<br>${metadata(a)}</div></div><div>${img(v?'替換圖 V'+v.id:'尚未匯入',!v)}<div class="mw-file">${v?'V'+v.id+' · ':''}${status(a)}</div><div class="mw-small">${v?metadata(v)+'<br>'+ (d.length?'⚠ '+d.join('<br>'):'✓ 圖片規格一致'):a.deployed!==null?'遊戲仍使用先前套用的版本':'進入詳細內容上傳替換圖'}</div></div><div class="mw-row-action">${B('詳細內容 →','detail',a.id)}<div class="mw-small">${a.versions.length} 筆歷史紀錄</div></div></article>`;}).join('')||'<div class="mw-note">目前沒有符合條件的素材。</div>';}
function work(){return `<div class="mw-title"><div><div class="mw-small">素材工作臺 / ${G()?'自訂群組':'原始資料夾'}</div><h2>${E(scopeTitle())}</h2><div class="mw-small">${scoped().length} 張素材 · 原始檔名與路徑保留</div></div><div class="mw-actions">${G()?B('＋ 新增素材','add-group')+B('刪除群組','delete-group'):''}</div></div><div class="mw-tools"><input type="search" data-search aria-label="搜尋檔名" placeholder="搜尋檔名…" value="${E(P().search)}"><select data-filter aria-label="篩選狀態">${[['all','全部狀態'],['pending','待套用'],['warning','有注意事項'],['empty','尚未替換'],['applied','已套用']].map(([v,t])=>`<option value="${v}" ${P().filter===v?'selected':''}>${t}</option>`).join('')}</select><label>背景 <select data-bg aria-label="預覽背景">${[['checker','棋盤格'],['white','白色'],['black','黑色'],['custom','自訂顏色']].map(([v,t])=>`<option value="${v}" ${P().bg===v?'selected':''}>${t}</option>`).join('')}</select></label><input data-color type="color" aria-label="自訂背景色" value="${P().color}" ${P().bg!=='custom'?'hidden':''}></div><div class="mw-selection">${selectionBar()}</div><div class="mw-columns"><span></span><span>原始圖片 · 固定基準</span><span>目前替換圖片</span><span>素材操作</span></div><div class="mw-rows">${rows()}</div><div class="mw-bottom">${B('批量匯入圖片','import')}<div class="mw-actions">${B('還原遊戲','restore')}${B('套用到遊戲','apply','',true)}</div></div>`;}
function detail(){const a=A(),v=a.versions.find(v=>v.id===previewId)||V(a),d=diffs(a,v);return `${B('← 返回素材列表','work')}<div class="mw-title" style="margin-top:18px"><div><div class="mw-small">素材詳細內容</div><h2>${a.name}</h2><div class="mw-small">img/${a.folder}/${a.name}</div></div><div class="mw-actions">${B('匯出此圖片','export-one')}${B('＋ 上傳替換圖片','upload','',true)}</div></div><div class="mw-detail-pair"><section><h3>原始圖片 · 固定基準</h3>${img('原圖 '+a.id)}<p class="mw-small">${metadata(a)}</p></section><section><h3>${v?'版本 V'+v.id+(v.id===a.active?' · 目前替換圖':' · 歷史預覽'):'尚無替換圖片'}</h3>${img(v?'上傳版本 V'+v.id:'無內容',!v)}<p class="mw-small">${v?metadata(v):'上傳後即可檢查差異'}</p>${v&&v.id!==a.active?B('使用此版本替換','use',v.id,true):''}</section></div>${d.length?`<div class="mw-note">⚠ 與原圖的差異<br>${d.join('<br>')}</div>`:''}<div class="mw-small">遊戲狀態：${a.deployed===null?'目前為原始圖片':'目前使用已套用版本 V'+a.deployed}</div><div class="mw-subhead"><h3>上傳歷史（${a.versions.length}）</h3><span class="mw-small">切換版本後須再次套用才更新遊戲</span></div>${a.versions.map(v=>`<div class="mw-history">${img('V'+v.id)}<div><strong>版本 V${v.id}${v.id===a.active?' · 目前使用':''}</strong><div class="mw-small">${E(v.time)}<br>${metadata(v)}</div></div><div class="mw-actions">${B('預覽','preview',v.id)}${B('使用此版本','use',v.id,false,v.id===a.active)}${B('刪除紀錄','delete-version',v.id)}</div></div>`).join('')||'<div class="mw-note">尚無上傳歷史紀錄。</div>'}`;}
function importIssues(){const targets=imports.filter(r=>r.target).map(r=>r.target);return imports.filter(r=>r.target&&(targets.filter(t=>t===r.target).length>1||(!r.accept&&diffs(P().assets.find(a=>a.id===r.target),r).length)));}
function importPage(){const count=imports.filter(r=>r.target).length;return `${B('← 返回工作臺','work')}<div class="mw-title" style="margin-top:18px"><div><h2>批量匯入與配對</h2><div class="mw-small">目標專案：${E(P().name)}</div></div>${B('載入示意修改圖片','load-import','',true)}</div><div class="mw-drop">拖入多張圖片或資料夾的位置<br><span class="mw-small">點選「載入示意修改圖片」測試配對、差異確認與略過。</span></div>${imports.length?`<div class="mw-table-wrap"><table><thead><tr><th>匯入圖片</th><th>配對原圖</th><th>檢查結果</th></tr></thead><tbody>${imports.map((r,i)=>{const a=P().assets.find(a=>a.id===r.target),d=a?diffs(a,r):[];const duplicate=r.target&&imports.filter(x=>x.target===r.target).length>1;return `<tr><td>${E(r.name)}<div class="mw-small">${metadata(r)}</div></td><td><select data-match="${i}" aria-label="${E(r.name)} 的配對原圖"><option value="0">略過／不匯入</option>${P().assets.map(a=>`<option value="${a.id}" ${r.target===a.id?'selected':''}>img/${a.folder}/${a.name}</option>`).join('')}</select><div class="mw-small">${r.target?'已指定目標':'尚未配對，此張將略過'}</div></td><td>${duplicate?'⚠ 多張圖片配對至同一原圖，請重新指定':!a?'未配對':d.length?'⚠ '+d.join('<br>'):'✓ 規格一致'}${d.length?`<label class="mw-choice"><input type="checkbox" data-accept="${i}" ${r.accept?'checked':''}>接受此圖片差異</label>`:''}</td></tr>`;}).join('')}</tbody></table></div><div class="mw-summary"><span>已配對 ${count} 張</span><span>略過 ${imports.length-count} 張</span><span>待處理 ${importIssues().length} 張</span></div>`:''}<div class="mw-bottom">${B('取消','work')}${B('確認匯入','confirm-import','',true,!count||!!importIssues().length)}</div>`;}
function operation(){const restore=screen==='restore',items=P().assets.filter(a=>restore?a.deployed!==null:pending(a));return `<div class="mw-window-heading"><div class="mw-small">獨立操作畫面</div><h2>${restore?'還原遊戲圖片':'確認套用到遊戲'}</h2></div><div class="mw-note">目標遊戲：${E(P().name)}<br><span class="mw-path">${E(P().path)}</span><br>${restore?'可還原':'待套用'}：${items.length} 張 · 原始備份已保留</div><div class="mw-table-wrap"><table><thead><tr>${restore?'<th>選取</th>':''}<th>素材</th><th>${restore?'還原內容':'替換版本'}</th><th>檢查結果</th></tr></thead><tbody>${items.map(a=>`<tr>${restore?`<td><input type="checkbox" data-restore="${a.id}" aria-label="還原 ${a.name}" ${restoreIds.has(a.id)?'checked':''}></td>`:''}<td>img/${a.folder}/${a.name}</td><td>${restore?'最初保存的原始檔案':'V'+a.active}</td><td>${restore?'✓ 原始備份可用':diffs(a,V(a)).length?'⚠ '+diffs(a,V(a)).join('<br>'):'✓ 圖片檢查通過'}</td></tr>`).join('')||'<tr><td colspan="4">目前沒有需要'+(restore?'還原':'套用')+'的圖片。</td></tr>'}</tbody></table></div>${restore?'<div class="mw-note">還原只恢復遊戲圖片。專案內的替換版本與歷史紀錄保留，之後可再次套用。</div>':'<p>遊戲檔案檢查：未發現外部變更（示意）</p><label class="mw-choice"><input type="checkbox" data-ack '+(ack?'checked':'')+'>已確認圖片差異與目標遊戲</label>'}<div class="mw-bottom">${B('← 返回工作臺','work')}${B(restore?'還原選取圖片':'套用這些圖片',restore?'confirm-restore':'confirm-apply','',true,restore?!restoreIds.size:!ack||!items.length)}</div>`;}
function drawModal(){if(!pop)return;let html='',t=pop.type;
if(t==='new-group')html=`<h3>建立群組</h3><label>群組名稱 <input id="group-name" maxlength="40" placeholder="例如：角色 B 差分"></label>${modalButtons('建立','create-group')}`;
if(t==='add-group')html=`<h3>新增素材至「${E(G().name)}」</h3>${P().assets.filter(a=>!G().members.includes(a.id)).map(a=>`<label class="mw-choice"><input type="checkbox" data-add="${a.id}">img/${a.folder}/${a.name}</label>`).join('')||'<p>所有素材都已在群組內。</p>'}${modalButtons('加入素材','add-members')}`;
if(t==='assign-group')html=`<h3>將 ${selected.size} 張素材加入群組</h3>${P().groups.length?`<label>目標群組 <select id="target-group">${P().groups.map(g=>`<option value="${g.id}">${E(g.name)}</option>`).join('')}</select></label>${modalButtons('加入群組','assign-confirm')}`:`<p>尚無群組。</p>${modalButtons('建立群組','new-group')}`}`;
if(t==='remove')html=`<h3>從群組移除 ${selected.size} 張素材？</h3><p>只移除群組關聯。原圖、替換版本與歷史紀錄仍保留。</p>${modalButtons('確認移除','remove-confirm')}`;
if(t==='delete-group')html=`<h3>刪除「${E(G().name)}」？</h3><p>群組中的素材和上傳歷史仍保留在專案中。</p>${modalButtons('刪除群組','delete-group-confirm')}`;
if(t==='use')html=`<h3>改用版本 V${pop.id}？</h3><p>此版本會成為目前替換圖；套用到遊戲後才更新遊戲檔案。</p>${modalButtons('確認替換','use-confirm',pop.id)}`;
if(t==='delete-version')html=`<h3>刪除版本 V${pop.id} 的紀錄？</h3><p>${A().active===pop.id?'這是目前替換版本，刪除後將清空目前替換圖。':'此版本會從上傳歷史中移除。'}遊戲內已套用的圖片與原始備份不受影響。</p>${modalButtons('刪除紀錄','delete-version-confirm',pop.id)}`;
if(t==='upload')html=`<h3>上傳替換圖片</h3><div class="mw-note">目標：${A().name}<br>此處使用示意圖片測試上傳流程。</div><label>新圖片 <select id="upload-spec"><option value="same">與原圖尺寸、比例及透明通道相同</option><option value="size">改為 1200 × 768</option><option value="alpha">與原圖同尺寸，但沒有透明通道</option></select></label><div id="upload-difference" class="mw-note">✓ 圖片規格一致</div><label class="mw-choice" id="upload-ack-row" hidden><input type="checkbox" id="upload-ack">接受上述差異</label>${modalButtons('匯入並設為替換圖','upload-confirm')}`;
if(t==='export')html=`<h3>${pop.single?'匯出圖片':'批量匯出'}</h3><div class="mw-form"><label>匯出範圍<select id="export-scope">${pop.single?'<option value="single">目前圖片</option>':`<option value="selected" ${selected.size?'':'disabled'}>已選取的 ${selected.size} 張圖片</option><option value="scope" ${selected.size?'':'selected'}>目前${G()?'群組':'資料夾'}（${scoped().length} 張）</option><option value="all">整個專案（${P().assets.length} 張）</option>`}</select></label><label>匯出版本<select id="export-version"><option value="original">原始圖片</option><option value="current">目前版本（無替換圖時使用原圖）</option></select></label><label>匯出位置<input value="D:/ImageEdits/${E(P().name)}" aria-label="匯出位置"></label></div><div class="mw-note">保留原始檔名及相對資料夾結構。</div>${modalButtons('確認匯出（示意）','export-confirm')}`;
if(t==='confirm-import')html=`<h3>確認匯入 ${imports.filter(r=>r.target).length} 張圖片？</h3><p>配對成功的圖片將新增上傳紀錄，成為目前替換版本。未配對的 ${imports.filter(r=>!r.target).length} 張圖片會略過。</p>${modalButtons('確認匯入','import-confirm')}`;
if(t==='confirm-apply')html=`<h3>確認套用到「${E(P().name)}」？</h3><p>預計替換 ${P().assets.filter(pending).length} 張圖片，寫入前保留原始備份。</p>${modalButtons('確認套用（示意）','apply-confirm')}`;
if(t==='confirm-restore')html=`<h3>確認還原 ${restoreIds.size} 張圖片？</h3><p>恢復遊戲原圖，保留專案內的替換版本及上傳歷史。</p>${modalButtons('確認還原（示意）','restore-confirm')}`;
if(t==='pick-folder')html=`<h3>選擇遊戲資料夾（示意）</h3><label>資料夾 <select id="folder-choice"><option>D:/Games/MyGame</option><option>D:/Games/NewAdventure</option><option>E:/RPG/AnotherGame</option></select></label>${modalButtons('選擇此資料夾','folder-confirm')}`;
if(t==='done')html=`<h3>${E(pop.title)}</h3><p>${E(pop.message)}</p><div class="mw-actions">${B(pop.target==='work'?'返回工作臺':'關閉','done-close','',true)}</div>`;
modal.innerHTML=`<section class="mw-panel">${html}<div class="mw-error" id="modal-error" role="alert" hidden></div></section>`;modal.querySelector('h3').id='mw-dialog-title';modal.setAttribute('aria-labelledby','mw-dialog-title');if(!modal.open)modal.showModal();}
function modalButtons(text,action,value=''){return `<div class="mw-actions">${B('取消','close')}${B(text,action,value,true)}</div>`;}
function modalError(text){const n=modal.querySelector('#modal-error');n.textContent=text;n.hidden=false;}
function render(){header();root.dataset.bg=P().bg;root.style.setProperty('--mw-custom',P().color);shell.classList.toggle('mw-separate',screen!=='work'&&screen!=='detail');sidebar();main.innerHTML=screen==='home'?home():screen==='new'?createPage():screen==='work'?work():screen==='detail'?detail():screen==='import'?importPage():operation();foot.textContent=(notice?notice+' · ':'')+'Wireframe 示意操作，不會讀寫遊戲檔案';}
function refreshRows(){main.querySelector('.mw-rows').innerHTML=rows();main.querySelector('.mw-selection').innerHTML=selectionBar();}
root.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const act=b.dataset.act,val=b.dataset.val;
if(act==='close'){closeModal();return;}
if(act==='home'){save();view('home');return;}if(act==='new'){view('new');return;}
if(act==='open-project'){projectId=Number(val);selected.clear();detailId=null;view('work');return;}
if(act==='work'){view('work');return;}
if(act==='scope'){P().scope=val;selected.clear();save();view('work');return;}
if(act==='detail'){detailId=Number(val);previewId=null;view('detail');return;}
if(act==='preview'){previewId=Number(val);render();return;}
if(act==='import'){imports=[];view('import');return;}
if(act==='load-import'){imports=[{name:'heroine_01.png',w:1024,h:768,alpha:true,target:1,accept:false},{name:'heroine_02.png',w:1200,h:768,alpha:true,target:2,accept:false},{name:'custom_expression.png',w:1024,h:768,alpha:true,target:0,accept:false}];render();return;}
if(act==='apply'||act==='restore'){view(act);return;}
if(['new-group','add-group','assign-group','remove','delete-group','upload','confirm-import','confirm-apply','confirm-restore','pick-folder'].includes(act)){open(act);return;}
if(act==='use'||act==='delete-version'){open(act,{id:Number(val)});return;}
if(act==='export'||act==='export-one'){open('export',{single:act==='export-one'});return;}
if(act==='folder-confirm'){const path=modal.querySelector('#folder-choice').value;closeModal();main.querySelector('#pr-path').value=path;return;}
if(act==='create-project'){const name=main.querySelector('#pr-name').value.trim(),path=main.querySelector('#pr-path').value.trim();if(!name||!path){const n=main.querySelector('#pr-error');n.hidden=false;n.textContent='請填寫專案名稱和遊戲資料夾。';return;}const p=seed(Math.max(...projects.map(p=>p.id))+1,name,path);p.assets.forEach(a=>{a.versions=[];a.active=null;a.deployed=null;a.next=1;});p.groups=[];p.scope='all';projects.push(p);projectId=p.id;selected.clear();save('專案已建立');view('work');return;}
if(act==='create-group'){const name=modal.querySelector('#group-name').value.trim();if(!name){modalError('請輸入群組名稱。');return;}const id=Math.max(0,...P().groups.map(g=>g.id))+1;P().groups.push({id,name,members:[]});P().scope='g'+id;selected.clear();screen='work';commit('已建立群組');return;}
if(act==='add-members'){const ids=[...modal.querySelectorAll('[data-add]:checked')].map(n=>Number(n.dataset.add));if(!ids.length){modalError('請先勾選要新增的素材。');return;}G().members=[...new Set([...G().members,...ids])];commit('已新增 '+ids.length+' 張素材至群組');return;}
if(act==='assign-confirm'){const g=P().groups.find(g=>g.id===Number(modal.querySelector('#target-group').value));g.members=[...new Set([...g.members,...selected])];commit('已加入「'+g.name+'」');return;}
if(act==='remove-confirm'){G().members=G().members.filter(id=>!selected.has(id));selected.clear();commit('已從群組移除素材');return;}
if(act==='delete-group-confirm'){const id=G().id;P().groups=P().groups.filter(g=>g.id!==id);P().scope='all';selected.clear();commit('已刪除群組，素材保留');return;}
if(act==='use-confirm'){A().active=Number(val);previewId=Number(val);commit('已切換目前替換版本');return;}
if(act==='delete-version-confirm'){const a=A(),id=Number(val);a.versions=a.versions.filter(v=>v.id!==id);if(a.active===id)a.active=null;if(previewId===id)previewId=null;commit('已刪除上傳紀錄');return;}
if(act==='upload-confirm'){const a=A(),spec=modal.querySelector('#upload-spec').value,data={name:a.name,w:spec==='size'?1200:a.w,h:spec==='size'?768:a.h,alpha:spec==='alpha'?false:a.alpha};if(diffs(a,data).length&&!modal.querySelector('#upload-ack').checked){modalError('請先確認圖片差異。');return;}previewId=addVersion(a,data);commit('已匯入新版本，等待套用');return;}
if(act==='import-confirm'){if(importIssues().length){modalError('請先處理配對或圖片差異。');return;}const entries=imports.filter(r=>r.target);entries.forEach(r=>addVersion(P().assets.find(a=>a.id===r.target),r));closeModal();save('已匯入 '+entries.length+' 張圖片');P().scope='all';P().filter='pending';P().search='';selected.clear();view('work');return;}
if(act==='export-confirm'){const mode=modal.querySelector('#export-scope').value;const count=mode==='single'?1:mode==='selected'?selected.size:mode==='scope'?scoped().length:P().assets.length;pop={type:'done',title:'匯出完成（示意）',message:`已示範匯出 ${count} 張圖片，保留檔名與資料夾結構。此預覽不產生實際圖片檔案。`,target:'stay'};drawModal();return;}
if(act==='apply-confirm'){const list=P().assets.filter(pending);list.forEach(a=>a.deployed=a.active);save('已示範套用 '+list.length+' 張圖片');pop={type:'done',title:'套用完成（示意）',message:'已套用 '+list.length+' 張圖片。原始備份保留，可隨時還原。',target:'work'};drawModal();return;}
if(act==='restore-confirm'){P().assets.filter(a=>restoreIds.has(a.id)).forEach(a=>a.deployed=null);save('已示範還原 '+restoreIds.size+' 張圖片');pop={type:'done',title:'還原完成（示意）',message:'遊戲已恢復原圖。專案內的替換圖仍保留，狀態回到待套用。',target:'work'};drawModal();return;}
if(act==='done-close'){const target=pop.target;closeModal();if(target==='work')view('work');else render();return;}
});
root.addEventListener('change',e=>{const t=e.target;
if(t.hasAttribute('data-project')){save();projectId=Number(t.value);selected.clear();detailId=null;imports=[];view('work');return;}
if(t.hasAttribute('data-check')){const id=Number(t.dataset.check);t.checked?selected.add(id):selected.delete(id);main.querySelector('.mw-selection').innerHTML=selectionBar();return;}
if(t.hasAttribute('data-all')){visible().forEach(a=>t.checked?selected.add(a.id):selected.delete(a.id));refreshRows();return;}
if(t.hasAttribute('data-filter')){P().filter=t.value;selected.clear();save();render();return;}
if(t.hasAttribute('data-bg')){P().bg=t.value;save();render();return;}
if(t.hasAttribute('data-match')){imports[Number(t.dataset.match)].target=Number(t.value);imports[Number(t.dataset.match)].accept=false;render();return;}
if(t.hasAttribute('data-accept')){imports[Number(t.dataset.accept)].accept=t.checked;render();return;}
if(t.hasAttribute('data-ack')){ack=t.checked;main.querySelector('[data-act=confirm-apply]').disabled=!ack||!P().assets.some(pending);return;}
