<div id="mw-wireframe">
  <header class="mw-top"><div><strong>RPG Maker 圖片管理器</strong><div class="mw-small">素材工作臺 · Wireframe / 示意操作</div></div><div class="mw-actions"><span>專案：月影之旅</span><span class="mw-small">✓ 工作進度已自動儲存</span></div></header>
  <div class="mw-shell"><aside class="mw-sidebar"></aside><main class="mw-main"></main></div>
  <footer class="mw-status" aria-live="polite">示意專案 · 所有操作僅改變此預覽，不會修改遊戲檔案</footer>
  <dialog class="mw-modal" aria-label="操作確認"></dialog>
</div>
<style>
#mw-wireframe{--mw-paper:light-dark(#fff,#202020);--mw-surface:light-dark(#f3f3f3,#292929);--mw-text:light-dark(#252525,#ededed);--mw-sub:light-dark(#666,#b7b7b7);--mw-line:light-dark(#b7b7b7,#686868);font:14px/1.5 system-ui,sans-serif;color:var(--mw-text);background:var(--mw-paper);border:1px solid var(--mw-line)}
#mw-wireframe *{box-sizing:border-box}#mw-wireframe [hidden]{display:none!important}
#mw-wireframe .mw-modal{color:var(--mw-text);background:var(--mw-paper);border:1px solid var(--mw-line);border-radius:6px;padding:0;width:540px;max-width:calc(100% - 28px);max-height:85vh;box-shadow:0 18px 60px #0005}#mw-wireframe .mw-modal::backdrop{background:#0006}#mw-wireframe .mw-modal .mw-panel{margin:0;padding:24px;border:0;background:var(--mw-paper)}#mw-wireframe .mw-modal .mw-actions{justify-content:flex-end;margin-top:24px}#mw-wireframe .mw-shell.mw-separate{grid-template-columns:1fr}#mw-wireframe .mw-separate .mw-sidebar{display:none}#mw-wireframe .mw-table-wrap{overflow:auto}#mw-wireframe table{width:100%;border-collapse:collapse;text-align:left;margin:22px 0}#mw-wireframe th,#mw-wireframe td{border-bottom:1px solid var(--mw-line);padding:14px 10px;vertical-align:top;overflow-wrap:anywhere}#mw-wireframe th{font-weight:500;background:var(--mw-surface)}#mw-wireframe .mw-window-heading{padding-bottom:18px;border-bottom:1px solid var(--mw-line);margin-bottom:22px}
#mw-wireframe button,#mw-wireframe input,#mw-wireframe select{font:inherit;color:inherit;background:var(--mw-paper);border:1px solid var(--mw-line);border-radius:3px;padding:7px 10px;max-width:100%}#mw-wireframe button{cursor:inherit}#mw-wireframe button:disabled{opacity:.45}#mw-wireframe button.mw-primary{background:var(--mw-text);color:var(--mw-paper)}
#mw-wireframe .mw-top{padding:16px 20px;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;border-bottom:1px solid var(--mw-line)}
#mw-wireframe strong{font-weight:500}#mw-wireframe .mw-small{font-size:12px;color:var(--mw-sub)}#mw-wireframe .mw-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}#mw-wireframe .mw-shell{display:grid;grid-template-columns:184px minmax(0,1fr)}
#mw-wireframe .mw-sidebar{padding:20px 12px;background:var(--mw-surface);border-right:1px solid var(--mw-line)}#mw-wireframe .mw-sidebar h3{font-size:12px;color:var(--mw-sub);font-weight:500;margin:0 0 10px}#mw-wireframe .mw-sidebar h3:not(:first-child){margin-top:26px}#mw-wireframe .mw-sidebar button{width:100%;text-align:left;margin-bottom:6px;background:transparent;border-color:transparent}#mw-wireframe .mw-sidebar button[aria-current]{border-color:var(--mw-line);background:var(--mw-paper)}#mw-wireframe .mw-sidebar button.mw-create{border:1px dashed var(--mw-line);margin-top:8px}
#mw-wireframe .mw-main{padding:20px;min-width:0;min-height:560px}#mw-wireframe h2{font-size:20px;font-weight:500;margin:0 0 3px}#mw-wireframe h3{font-size:15px;font-weight:500;margin:0 0 10px}#mw-wireframe p{margin:6px 0 14px}#mw-wireframe .mw-title{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}#mw-wireframe .mw-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 0;border-top:1px solid var(--mw-line);border-bottom:1px solid var(--mw-line)}#mw-wireframe .mw-tools input[type=search]{width:180px}#mw-wireframe .mw-selection{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:12px 0}#mw-wireframe .mw-columns,#mw-wireframe .mw-item{display:grid;grid-template-columns:22px minmax(0,1fr) minmax(0,1fr) 96px;gap:14px}#mw-wireframe .mw-columns{background:var(--mw-surface);padding:9px 8px;font-size:12px}#mw-wireframe .mw-item{padding:16px 8px;border-bottom:1px solid var(--mw-line);align-items:start}#mw-wireframe .mw-item>input{margin-top:8px}#mw-wireframe .mw-item .mw-row-action{padding-top:4px}#mw-wireframe .mw-row-action button{width:100%;margin-bottom:8px}#mw-wireframe .mw-file{overflow-wrap:anywhere;font-weight:500;margin-top:7px}
#mw-wireframe .mw-image{height:104px;border:1px solid var(--mw-line);display:flex;align-items:center;justify-content:center;background-color:var(--mw-surface);position:relative;isolation:isolate}#mw-wireframe .mw-image:before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(to top right,transparent calc(50% - .5px),var(--mw-line) 50%,transparent calc(50% + .5px)),linear-gradient(to bottom right,transparent calc(50% - .5px),var(--mw-line) 50%,transparent calc(50% + .5px))}#mw-wireframe .mw-image span{background:var(--mw-paper);padding:3px 9px;border:1px solid var(--mw-line)}#mw-wireframe .mw-image.mw-empty{border-style:dashed;background:var(--mw-paper)}#mw-wireframe .mw-empty:before{display:none}#mw-wireframe[data-bg=checker] .mw-image:not(.mw-empty){background-image:conic-gradient(var(--mw-paper) 25%,var(--mw-surface) 0 50%,var(--mw-paper) 0 75%,var(--mw-surface) 0);background-size:18px 18px}#mw-wireframe[data-bg=white] .mw-image:not(.mw-empty){background:#fff}#mw-wireframe[data-bg=black] .mw-image:not(.mw-empty){background:#000}#mw-wireframe[data-bg=custom] .mw-image:not(.mw-empty){background:var(--mw-custom)}
#mw-wireframe .mw-note{padding:12px;border:1px dashed var(--mw-line);background:var(--mw-surface);margin:12px 0}#mw-wireframe .mw-panel{border:1px solid var(--mw-line);padding:16px;margin:0 0 18px;background:var(--mw-surface)}#mw-wireframe .mw-panel .mw-actions{margin-top:14px}#mw-wireframe .mw-choice{display:flex;gap:9px;align-items:center;padding:8px 0;overflow-wrap:anywhere}#mw-wireframe .mw-status{padding:10px 18px;border-top:1px solid var(--mw-line);font-size:12px;color:var(--mw-sub)}#mw-wireframe .mw-detail-pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin:20px 0}#mw-wireframe .mw-detail-pair .mw-image{height:180px}#mw-wireframe .mw-history{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:14px;padding:14px 0;border-bottom:1px solid var(--mw-line);align-items:center}#mw-wireframe .mw-history .mw-image{height:60px}#mw-wireframe .mw-history .mw-image span{font-size:12px}#mw-wireframe .mw-history .mw-actions{justify-content:flex-end}#mw-wireframe .mw-detail-back{margin-bottom:18px}#mw-wireframe .mw-bottom{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-top:16px}
@media(max-width:760px){#mw-wireframe .mw-shell{grid-template-columns:1fr}#mw-wireframe .mw-sidebar{border-right:0;border-bottom:1px solid var(--mw-line);padding:12px}#mw-wireframe .mw-sidebar button{width:auto;margin-right:4px}#mw-wireframe .mw-sidebar h3{margin-bottom:6px}#mw-wireframe .mw-sidebar h3:not(:first-child){margin-top:12px}#mw-wireframe .mw-main{padding:14px}#mw-wireframe .mw-columns,#mw-wireframe .mw-item{grid-template-columns:20px minmax(0,1fr) minmax(0,1fr);gap:9px}#mw-wireframe .mw-columns>span:last-child{display:none}#mw-wireframe .mw-row-action{grid-column:2/4;display:flex;gap:10px;align-items:center}#mw-wireframe .mw-row-action button{width:auto!important;margin:0!important}#mw-wireframe .mw-history{grid-template-columns:60px minmax(0,1fr)}#mw-wireframe .mw-history .mw-actions{grid-column:2;justify-content:flex-start}}
@media(max-width:420px){#mw-wireframe .mw-detail-pair{grid-template-columns:1fr}#mw-wireframe .mw-top{padding:12px}#mw-wireframe button,#mw-wireframe input,#mw-wireframe select{min-height:40px}#mw-wireframe .mw-image{height:86px}}
</style>
<script>
(()=>{
const root=document.getElementById('mw-wireframe'), main=root.querySelector('.mw-main'), sidebar=root.querySelector('.mw-sidebar'), status=root.querySelector('.mw-status');
const assets=[{id:1,name:'heroine_01.png',folder:'pictures',versions:[{id:2,w:1024,h:768,time:'今天 14:32'},{id:1,w:1024,h:768,time:'昨天 18:10'}],active:2},{id:2,name:'heroine_02.png',folder:'pictures',versions:[{id:1,w:1200,h:768,time:'今天 14:35'}],active:1},{id:3,name:'heroine_03.png',folder:'pictures',versions:[],active:null},{id:4,name:'heroine_04.png',folder:'pictures',versions:[],active:null},{id:5,name:'hero_walk.png',folder:'characters',versions:[],active:null}];
let groups=[{id:1,name:'角色 A 差分',members:[1,2,3]},{id:2,name:'待修改素材',members:[2,4]}], scope='g1', detail=null, selected=new Set(), search='',filter='all',panel=null, bg='checker',custom='#bcbcbc',preview=null;
let screen='work', returnFocus=null;
const modal=root.querySelector('.mw-modal');
const deployed=new Set([1,2]);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const btn=(text,action,value='',cls='',disabled=false)=>`<button type="button" class="cursor-interaction ${cls}" data-action="${action}" data-value="${esc(value)}" ${disabled?'disabled':''}>${text}</button>`;
const image=(label,empty=false)=>`<div class="mw-image ${empty?'mw-empty':''}"><span>${esc(label)}</span></div>`;
const group=()=>groups.find(g=>'g'+g.id===scope);
const current=a=>a.versions.find(v=>v.id===a.active);
const state=a=>!current(a)?'empty':current(a).w!==1024||current(a).h!==768?'warning':'pending';
const ratio=v=>v.w===1200?'25:16':'4:3';
const visible=()=>assets.filter(a=>(scope==='all'||scope==='f'+a.folder||(group()&&group().members.includes(a.id)))&&a.name.toLowerCase().includes(search.toLowerCase())&&(filter==='all'||filter===state(a)||(filter==='pending'&&state(a)==='warning')));
const title=()=>group()?group().name:scope==='all'?'全部素材':'img / '+scope.slice(1);
function notify(s){status.textContent=s+' · 已自動儲存（示意）';}
function side(){sidebar.innerHTML=`<h3>原始資料夾</h3>${btn('全部素材（5）','scope','all')}${btn('img / pictures（4）','scope','fpictures')}${btn('img / characters（1）','scope','fcharacters')}<h3>自訂群組</h3>${groups.map(g=>btn(esc(g.name)+'（'+g.members.length+'）','scope','g'+g.id)).join('')}${btn('＋ 建立群組','new-group','','mw-create')}`;sidebar.querySelectorAll('[data-action=scope]').forEach(b=>{if(b.dataset.value===scope)b.setAttribute('aria-current','page');});}
function panelHTML(){if(!panel)return '';let html='';
if(panel.type==='remove')html=`<h3>從群組移除 ${selected.size} 張素材？</h3><p>移除「${esc(group().name)}」中的群組關聯。來源檔案、替換版本與上傳歷史保留。</p><div class="mw-actions">${btn('取消','close')}${btn('確認移除','remove-confirm','','mw-primary')}</div>`;
if(panel.type==='use')html=`<h3>改用版本 V${panel.id}？</h3><p>此版本將成為目前替換圖，等待套用到遊戲。其他上傳版本保留在歷史紀錄中。</p><div class="mw-actions">${btn('取消','close')}${btn('確認替換版本','use-confirm',panel.id,'mw-primary')}</div>`;
if(panel.type==='commit-apply')html=`<h3>確認寫入遊戲？</h3><p>月影之旅 · 本次替換 ${assets.filter(a=>current(a)).length} 張圖片。</p><p class="mw-small">已確認圖片差異，寫入前保留備份。</p><div class="mw-actions">${btn('取消','close')}${btn('確認套用（示意）','apply-confirm','','mw-primary')}</div>`;
if(panel.type==='commit-restore')html=`<h3>確認還原 ${panel.ids.length} 張圖片？</h3><p>將恢復遊戲中的原始圖片。專案內的替換圖片與歷史紀錄保留。</p><div class="mw-actions">${btn('取消','close')}${btn('確認還原（示意）','restore-confirm','','mw-primary')}</div>`;
if(panel.type==='done')html=`<h3>${panel.title}</h3><p>${panel.message}</p><div class="mw-actions">${btn('返回工作臺','return-work','','mw-primary')}</div>`;
if(panel.type==='new-group')html=`<h3>建立群組</h3><label>群組名稱 <input id="mw-group-name" placeholder="例如：角色 B 差分" maxlength="40"></label><div class="mw-actions">${btn('取消','close')}${btn('建立','create','','mw-primary')}</div>`;
if(panel.type==='add')html=`<h3>新增素材至「${esc(group().name)}」</h3>${assets.filter(a=>!group().members.includes(a.id)).map(a=>`<label class="mw-choice"><input type="checkbox" data-add="${a.id}">img/${a.folder}/${a.name}</label>`).join('')||'<p>所有素材都已在此群組。</p>'}<div class="mw-actions">${btn('取消','close')}${btn('加入勾選素材','add-confirm','','mw-primary')}</div>`;
if(panel.type==='delete-group')html=`<h3>刪除「${esc(group().name)}」？</h3><p>只刪除群組；原圖、替換版本與上傳歷史全部保留。</p><div class="mw-actions">${btn('取消','close')}${btn('確認刪除群組','delete-group-confirm')}</div>`;
if(panel.type==='delete-version'){const a=assets.find(a=>a.id===detail);html=`<h3>刪除 V${panel.id} 上傳紀錄？</h3><p>${a.active===panel.id?'此版本是目前替換圖；刪除後將清除待套用版本。':'此版本將從上傳歷史中移除。'}原圖與遊戲檔案不受影響。</p><div class="mw-actions">${btn('取消','close')}${btn('確認刪除紀錄','delete-version-confirm',panel.id)}</div>`;}
if(panel.type==='upload')html=`<h3>上傳新的替換版本</h3><div class="mw-note">拖入圖片或選擇檔案的位置</div><p class="mw-small">此處使用示意圖片，展示新增紀錄及替換流程。</p><label>圖片尺寸 <select id="mw-upload-size"><option value="1024">1024 × 768（與原圖相同）</option><option value="1200">1200 × 768（比例不同）</option></select></label><div class="mw-actions">${btn('取消','close')}${btn('模擬上傳並設為替換圖','upload-confirm','','mw-primary')}</div>`;
if(panel.type==='export')html=`<h3>批量匯出</h3><p>匯出 ${selected.size||visible().length} 張圖片，保留原始檔名與相對路徑。</p><label>版本 <select><option>原始圖片</option><option>目前替換版本</option></select></label><div class="mw-actions">${btn('關閉','close')}${btn('確認匯出（示意）','export-confirm','','mw-primary')}</div>`;
if(panel.type==='apply')html=`<h3>套用到遊戲</h3><p>目標：月影之旅 · D:/Games/MoonJourney</p><p>共 ${assets.filter(a=>current(a)).length} 張替換圖片；原始備份保留。</p><div class="mw-note">${assets.filter(a=>state(a)==='warning').map(a=>a.name+'：解析度與長寬比不同').join('<br>')||'圖片檢查通過'}</div><div class="mw-actions">${btn('返回工作臺','close')}${btn('確認套用（示意）','apply-confirm','','mw-primary')}</div>`;
return `<section class="mw-panel" aria-label="操作面板">${html}</section>`;}
function listHTML(){const g=group();return `<div class="mw-title"><div><div class="mw-small">素材工作臺 / ${g?'自訂群組':'原始資料夾'}</div><h2>${esc(title())}</h2><div class="mw-small">${g?g.members.length+' 張素材 · 群組只整理素材，不搬動來源檔案':'依遊戲原始資料夾顯示'}</div></div><div class="mw-actions">${g?btn('＋ 新增素材','add')+btn('刪除群組','delete-group'):''}</div></div><div class="mw-tools"><input type="search" aria-label="搜尋檔名" placeholder="搜尋檔名…" value="${esc(search)}"><select data-filter aria-label="篩選狀態"><option value="all">全部狀態</option><option value="pending">待套用</option><option value="warning">有注意事項</option><option value="empty">尚未替換</option></select><label>背景 <select data-bg aria-label="預覽背景"><option value="checker">棋盤格</option><option value="white">白色</option><option value="black">黑色</option><option value="custom">自訂</option></select></label><input type="color" data-color aria-label="自訂背景顏色" value="${custom}" ${bg!=='custom'?'hidden':''}></div><div class="mw-selection"><label class="mw-actions"><input type="checkbox" data-all ${visible().length&&visible().every(a=>selected.has(a.id))?'checked':''}>全選 · 已選 ${selected.size} 張</label><div class="mw-actions">${btn('批量匯出','export')}${g?btn('從群組移除','remove','','',selected.size===0):''}</div></div><div class="mw-columns"><span></span><span>原始圖片 · 固定基準</span><span>目前替換圖片</span><span>素材操作</span></div><div class="mw-rows">${rowsHTML()}</div><div class="mw-bottom"><span class="mw-small">上傳與版本操作位於每列的「詳細內容」</span><div class="mw-actions">${btn('還原遊戲','restore')}${btn('套用到遊戲','apply','','mw-primary')}</div></div>`;}
function rowsHTML(){return visible().map(a=>{const v=current(a);return `<article class="mw-item"><input type="checkbox" data-check="${a.id}" aria-label="選取 ${a.name}" ${selected.has(a.id)?'checked':''}><div>${image('原圖 '+a.id)}<div class="mw-file">${a.name}</div><div class="mw-small">img/${a.folder}/${a.name}<br>1024 × 768 · 4:3<br>PNG · 有透明通道</div></div><div>${image(v?'替換圖 V'+v.id:'尚未上傳',!v)}<div class="mw-file">${v?'V'+v.id+' · 待套用':'無替換版本'}</div><div class="mw-small">${v?`${v.w} × ${v.h} · ${ratio(v)}<br>${state(a)==='warning'?'⚠ 尺寸與比例不同':'✓ 尺寸、比例與透明通道一致'}`:'進入詳細內容上傳圖片'}</div></div><div class="mw-row-action">${btn('詳細內容 →','detail',a.id)}<div class="mw-small">${a.versions.length} 筆上傳紀錄</div></div></article>`;}).join('')||'<div class="mw-note">目前沒有符合條件的素材。</div>';}
function detailHTML(){const a=assets.find(a=>a.id===detail),v=current(a),shown=a.versions.find(x=>x.id===preview)||v;return `${btn('← 返回素材列表','back','','mw-detail-back')}<div class="mw-title"><div><div class="mw-small">素材詳細內容</div><h2>${a.name}</h2><div class="mw-small">img/${a.folder}/${a.name}</div></div>${btn('＋ 上傳替換圖片','upload','','mw-primary')}</div><div class="mw-detail-pair"><section><h3>原始圖片 · 固定基準</h3>${image('原始圖片')}<p class="mw-small">1024 × 768 · 4:3 · PNG · 有透明通道</p></section><section><h3>${shown?'版本 V'+shown.id+(shown.id===a.active?' · 目前替換圖':' · 歷史預覽'):'尚未上傳替換圖片'}</h3>${image(shown?'上傳圖片 V'+shown.id:'無內容',!shown)}<p class="mw-small">${shown?shown.w+' × '+shown.h+' · '+ratio(shown)+' · PNG · 有透明通道':'上傳後即可預覽與比較'}</p>${shown&&shown.id!==a.active?btn('使用此版本替換','use',shown.id,'mw-primary'):''}</section></div>${shown&&shown.w!==1024?'<div class="mw-note">注意：解析度 1024 × 768 → 1200 × 768；長寬比 4:3 → 25:16。</div>':''}<h3>上傳歷史（${a.versions.length}）</h3><p class="mw-small">使用版本僅更新專案中的替換圖，按「套用到遊戲」才寫入遊戲。</p>${a.versions.map(x=>`<div class="mw-history">${image('V'+x.id)}<div><strong>版本 V${x.id}${a.active===x.id?' · 目前使用':''}</strong><div class="mw-small">${x.time}<br>${x.w} × ${x.h} · ${ratio(x)}</div></div><div class="mw-actions">${btn('預覽','preview',x.id)}${btn('使用此版本','use',x.id,'',a.active===x.id)}${btn('刪除紀錄','delete-version',x.id)}</div></div>`).join('')||'<div class="mw-note">尚無上傳紀錄。</div>'}`;}
function operationHTML(){const restoring=screen==='restore',items=assets.filter(a=>restoring?deployed.has(a.id):current(a));return `<div class="mw-window-heading"><div class="mw-small">獨立操作視窗 · 月影之旅</div><h2>${restoring?'還原遊戲圖片':'確認套用到遊戲'}</h2></div><div class="mw-note">目標遊戲：月影之旅<br>D:/Games/MoonJourney<br>${restoring?'可還原':'預計替換'}：${items.length} 張 · 原始備份已保留</div><div class="mw-table-wrap"><table><thead><tr>${restoring?'<th>選取</th>':''}<th>素材</th><th>${restoring?'還原內容':'替換狀態'}</th><th>檢查結果</th></tr></thead><tbody>${items.map(a=>`<tr>${restoring?`<td><input type="checkbox" checked data-restore-id="${a.id}" aria-label="還原 ${a.name}"></td>`:''}<td>img/${a.folder}/${a.name}</td><td>${restoring?'最初保存的原始檔案':'目前替換版本 V'+a.active}</td><td>${restoring?'✓ 原始備份可用':state(a)==='warning'?'⚠ 解析度 1024 × 768 → 1200 × 768<br>長寬比 4:3 → 25:16':'✓ 圖片檢查通過'}</td></tr>`).join('')||`<tr><td colspan="4">${restoring?'目前沒有需要還原的圖片。':'目前沒有替換圖片。'}</td></tr>`}</tbody></table></div>${restoring?'<div class="mw-note">還原後保留專案內的替換圖片與上傳歷史，可再次套用。</div>':'<p>遊戲檔案檢查：未發現外部變更</p><label class="mw-choice"><input type="checkbox" data-apply-ack>已確認圖片差異與目標遊戲</label>'}<div class="mw-bottom">${btn('← 返回工作臺','return-work')}${restoring?btn('還原選取圖片','restore-review','','mw-primary',!items.length):btn('套用這些圖片','apply-review','','mw-primary',true)}</div>`;}
function render(){
if(panel){modal.innerHTML=panelHTML();const heading=modal.querySelector('h3');if(heading){heading.id='mw-modal-heading';modal.setAttribute('aria-labelledby','mw-modal-heading');}if(!modal.open)modal.showModal();return;}
const wasOpen=modal.open;if(wasOpen)modal.close();
side();root.dataset.bg=bg;root.style.setProperty('--mw-custom',custom);root.querySelector('.mw-shell').classList.toggle('mw-separate',screen!=='work');main.innerHTML=screen!=='work'?operationHTML():detail?detailHTML():listHTML();const f=main.querySelector('[data-filter]'),b=main.querySelector('[data-bg]');if(f)f.value=filter;if(b)b.value=bg;
if(wasOpen&&returnFocus){const action=returnFocus.dataset.action,value=returnFocus.dataset.value;const target=[...root.querySelectorAll('[data-action]')].find(el=>el.dataset.action===action&&el.dataset.value===value);if(target)target.focus({preventScroll:true});}
}
modal.addEventListener('cancel',e=>{e.preventDefault();panel=null;render();});
root.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;if(!modal.open)returnFocus=b;const act=b.dataset.action,val=b.dataset.value,a=assets.find(x=>x.id===detail);
if(act==='scope'){scope=val;detail=null;selected.clear();panel=null;search='';filter='all';}
else if(act==='detail'){detail=Number(val);preview=null;panel=null;}
else if(act==='back'){detail=null;panel=null;preview=null;}
else if(act==='close')panel=null;
else if(act==='new-group')panel={type:'new-group'};
else if(act==='create'){const n=modal.querySelector('#mw-group-name').value.trim();if(!n){modal.querySelector('#mw-group-name').focus();return;}const id=Math.max(0,...groups.map(g=>g.id))+1;groups.push({id,name:n,members:[]});scope='g'+id;detail=null;selected.clear();panel=null;notify('已建立群組「'+n+'」');}
else if(act==='add')panel={type:'add'};
else if(act==='add-confirm'){const ids=[...modal.querySelectorAll('[data-add]:checked')].map(c=>Number(c.dataset.add));group().members.push(...ids);panel=null;notify('已新增 '+ids.length+' 張素材至群組');}
else if(act==='remove')panel={type:'remove'};
else if(act==='remove-confirm'){panel=null;group().members=group().members.filter(id=>!selected.has(id));notify('已從群組移除 '+selected.size+' 張素材，來源檔案保留');selected.clear();}
else if(act==='delete-group')panel={type:'delete-group'};
else if(act==='delete-group-confirm'){const id=group().id;groups=groups.filter(g=>g.id!==id);scope='all';selected.clear();panel=null;notify('已刪除群組，素材及上傳歷史保留');}
else if(act==='upload')panel={type:'upload'};
else if(act==='upload-confirm'){const id=Math.max(0,...a.versions.map(v=>v.id))+1,w=Number(modal.querySelector('#mw-upload-size').value);a.versions.unshift({id,w,h:768,time:'剛剛（示意）'});a.active=id;preview=id;panel=null;notify('已新增版本 V'+id+' 並設為目前替換圖');}
else if(act==='preview')preview=Number(val);
else if(act==='use')panel={type:'use',id:Number(val)};
else if(act==='use-confirm'){panel=null;a.active=Number(val);preview=a.active;notify('已切換為版本 V'+val+'，尚未套用到遊戲');}
else if(act==='delete-version')panel={type:'delete-version',id:Number(val)};
else if(act==='delete-version-confirm'){const id=Number(val);a.versions=a.versions.filter(v=>v.id!==id);if(a.active===id)a.active=null;if(preview===id)preview=null;panel=null;notify('已刪除版本 V'+id+' 的上傳紀錄');}
else if(act==='export')panel={type:'export'};
else if(act==='apply'||act==='restore'){screen=act;panel=null;}
else if(act==='return-work'){screen='work';panel=null;}
else if(act==='apply-review')panel={type:'commit-apply'};
else if(act==='restore-review'){const ids=[...main.querySelectorAll('[data-restore-id]:checked')].map(c=>Number(c.dataset.restoreId));if(ids.length)panel={type:'commit-restore',ids};}
else if(act==='restore-confirm'){const ids=panel.ids;ids.forEach(id=>deployed.delete(id));panel={type:'done',title:'還原完成（示意）',message:'已示範還原 '+ids.length+' 張圖片。替換版本與上傳歷史仍保留。'};}
else if(act==='export-confirm'){panel=null;notify('匯出流程展示完成，未輸出實際檔案');}
else if(act==='apply-confirm'){assets.filter(a=>current(a)).forEach(a=>deployed.add(a.id));panel={type:'done',title:'套用完成（示意）',message:'替換清單已完成套用流程示範，原始備份保留。'};}
render();});
root.addEventListener('input',e=>{if(e.target.matches('[type=search]')){search=e.target.value;main.querySelector('.mw-rows').innerHTML=rowsHTML();}if(e.target.hasAttribute('data-color')){custom=e.target.value;root.style.setProperty('--mw-custom',custom);}});
root.addEventListener('change',e=>{if(e.target.hasAttribute('data-apply-ack')){main.querySelector('[data-action=apply-review]').disabled=!e.target.checked;return;}if(e.target.hasAttribute('data-restore-id')){main.querySelector('[data-action=restore-review]').disabled=!main.querySelector('[data-restore-id]:checked');return;}if(e.target.hasAttribute('data-check')){const id=Number(e.target.dataset.check);e.target.checked?selected.add(id):selected.delete(id);render();}else if(e.target.hasAttribute('data-all')){visible().forEach(a=>e.target.checked?selected.add(a.id):selected.delete(a.id));render();}else if(e.target.hasAttribute('data-filter')){filter=e.target.value;selected.clear();render();}else if(e.target.hasAttribute('data-bg')){bg=e.target.value;render();}});
render();
})();
</script>
